name: News Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch, classify and attach article images
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          feeds=[('الجنوب اليوم','https://aljanoubalyoum.tv/feed/'),('الجزيرة','https://www.aljazeera.net/aljazeera/rss')]
          regions={'عدن':['عدن','المعلا','التواهي','خور مكسر','المنصورة','الشيخ عثمان','كريتر','دار سعد','البريقة'],'حضرموت':['حضرموت','المكلا','سيئون','تريم','الشحر','غيل باوزير','وادي حضرموت'],'شبوة':['شبوة','عتق','بيحان','مرخة','نصاب','رضوم'],'أبين':['أبين','زنجبار','خنفر','لودر','مودية','أحور','شقرة'],'لحج':['لحج','الحوطة','طور الباحة','المضاربة','ردفان','يافع','المسيمير'],'الضالع':['الضالع','قعطبة','الحصين','الشعيب','جحاف','الأزارق'],'سقطرى':['سقطرى','حديبو'],'المهرة':['المهرة','الغيضة','حوف','نشطون'],'تعز':['تعز','المخا','التربة'],'صنعاء':['صنعاء'],'صعدة':['صعدة'],'الحديدة':['الحديدة','حيس','الخوخة'],'مأرب':['مأرب'],'الجوف':['الجوف'],'حجة':['حجة'],'إب':['إب'],'البيضاء':['البيضاء'],'اليمن':['اليمن','يمني','اليمنية']}

          def classify(title,desc):
              text=(title+' '+desc).lower()
              for region,words in regions.items():
                  if any(w.lower() in text for w in words): return region
              return 'اليمن'

          def child_text(item,name):
              for c in item:
                  if c.tag.split('}')[-1].lower()==name.lower(): return ''.join(c.itertext()).strip()
              return ''

          def find_image(item,desc):
              for c in item.iter():
                  tag=c.tag.split('}')[-1].lower()
                  if tag in ('content','thumbnail','enclosure'):
                      u=c.attrib.get('url','').strip(); typ=c.attrib.get('type','').lower()
                      if u and (typ.startswith('image/') or re.search(r'\.(jpg|jpeg|png|webp)(\?|$)',u,re.I)): return u
              m=re.search(r'<img[^>]+(?:src|data-src)=["\']([^"\']+)',desc,re.I)
              return m.group(1).strip() if m else ''

          def page_image(url):
              if not url: return ''
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NashhalNewsBot/1.0'})
                  html=urllib.request.urlopen(req,timeout=12).read().decode('utf-8','ignore')
                  patterns=[r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)']
                  for p in patterns:
                      m=re.search(p,html,re.I)
                      if m:
                          return urllib.parse.urljoin(url,m.group(1).strip())
              except Exception as e:
                  print('Image lookup failed:',url,e)
              return ''

          path=Path('data/news.json')
          try: existing=json.loads(path.read_text(encoding='utf-8'))
          except Exception: existing=[]
          if not isinstance(existing,list): existing=[]
          seen={x.get('link') or x.get('source_url') for x in existing if isinstance(x,dict)}
          new=[]

          for source,url in feeds:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'NashhalNewsBot/1.0'})
                  root=ET.fromstring(urllib.request.urlopen(req,timeout=20).read())
              except Exception as e:
                  print('Feed failed:',source,e); continue
              for item in root.iter():
                  if item.tag.split('}')[-1].lower()!='item': continue
                  title=child_text(item,'title'); link=child_text(item,'link'); date=child_text(item,'pubDate') or child_text(item,'published') or child_text(item,'updated')
                  rawdesc=child_text(item,'description'); desc=re.sub(r'<[^>]+>',' ',rawdesc).strip()
                  if not title or not link or link in seen: continue
                  image=find_image(item,rawdesc) or page_image(link)
                  region=classify(title,desc)
                  new.append({'id':'rss-'+re.sub(r'[^a-zA-Z0-9]+','',link)[-20:],'title':title,'source':source,'source_name':source,'source_url':link,'link':link,'published':date,'published_at':date,'collected_at':datetime.now(timezone.utc).isoformat(),'category':region,'region':region,'status':'published','confidence':'medium','auto_published':True,'summary':desc[:500],'description':desc[:500],'content':desc[:500],'image':image,'image_url':image,'thumbnail':image,'platform':'rss','source_type':'يمني' if source=='الجنوب اليوم' else 'دولي','embed_url':''})
                  seen.add(link)
                  if len(new)>=20: break
              if len(new)>=20: break

          # Classify old articles and backfill only missing images from their original article pages.
          checked=0
          for item in existing:
              if not isinstance(item,dict): continue
              item['region']=classify(str(item.get('title','')),str(item.get('summary',item.get('description',''))))
              if item.get('category') in ('الجنوب','اليمن') or not item.get('category'): item['category']=item['region']
              image=item.get('image') or item.get('image_url') or item.get('thumbnail')
              if not image and (item.get('source_url') or item.get('link')) and checked<30:
                  image=page_image(item.get('source_url') or item.get('link'))
                  if image:
                      item['image']=item['image_url']=item['thumbnail']=image
                  checked+=1

          path.write_text(json.dumps(new+existing,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Added',len(new),'new items and backfilled up to',checked,'existing article images')
          PY

      - name: Commit updates
        run: |
          git config user.name 'nashhal-news-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/news.json
          git diff --cached --quiet || git commit -m 'Attach images to their original news articles'
          git push
