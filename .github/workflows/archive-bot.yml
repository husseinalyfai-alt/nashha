name: Heritage Archive Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/archive_bot.py'
      - '.github/workflows/archive-bot.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Search Wikimedia Commons and Internet Archive
        run: python scripts/archive_bot.py
      - name: Commit archive index
        run: |
          git config user.name 'nashhal-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/heritage-images.json data/historical-sources.json
          if git diff --cached --quiet; then
            echo 'لا توجد تحديثات جديدة في الأرشيف.'
            exit 0
          fi
          git commit -m 'تحديث الأرشيف والمصادر التاريخية'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
