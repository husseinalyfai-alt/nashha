name: Heritage Archive Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Search public archive images
        run: python scripts/archive_bot.py
      - name: Attach gallery to heritage page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('heritage.html')
          s=p.read_text(encoding='utf-8')
          if 'archive-gallery.css' not in s:
              s=s.replace('</head>', '<link rel="stylesheet" href="archive-gallery.css"></head>')
          if 'archive-gallery.js' not in s:
              s=s.replace('</body>', '<script src="archive-gallery.js"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit archive index and page wiring
        run: |
          git config user.name 'nashhal-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/heritage-images.json heritage.html
          git diff --cached --quiet || git commit -m 'تحديث معرض الصور التراثية'
          git push
