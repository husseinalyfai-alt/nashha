name: Instagram Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/instagram_bot.py

      - name: Commit changes
        run: |
          git config user.name 'nashhal-instagram-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/instagram.json
          git diff --cached --quiet || git commit -m 'مزامنة منشورات إنستغرام'
          git push
